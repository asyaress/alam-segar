<script nonce="{{.CSPNonce}}">
(function(){
 var path=location.pathname;document.querySelectorAll('[data-nav]').forEach(function(a){var target=a.dataset.nav;if(path===target||(target!='/penghuni'&&path.indexOf(target)===0))a.classList.add('active')});
 var offline=document.getElementById('tenant-offline');function network(){offline.classList.toggle('show',!navigator.onLine)}window.addEventListener('online',network);window.addEventListener('offline',network);network();
 if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/service-worker.js',{scope:'/'}).catch(function(){})})}
 var promptEvent=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();promptEvent=e;document.querySelectorAll('[data-pwa-install]').forEach(function(b){b.classList.add('ready')})});
 document.querySelectorAll('[data-pwa-install]').forEach(function(button){button.addEventListener('click',function(){if(!promptEvent)return;promptEvent.prompt();promptEvent.userChoice.finally(function(){promptEvent=null;document.querySelectorAll('[data-pwa-install]').forEach(function(b){b.classList.remove('ready')})})})});
 var isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;if(isiOS&&!standalone){document.querySelectorAll('.ios-install-tip').forEach(function(x){x.style.display='block'})}
 document.querySelectorAll('[data-print-page]').forEach(function(button){button.addEventListener('click',function(){window.print()})});
})();
