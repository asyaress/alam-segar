{{define "login"}}
<!DOCTYPE html>
<html lang="id" class="h-100">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover">
    <title>{{.Title}}</title>
    <link rel="shortcut icon" type="image/png" href="/assets/admin/images/favicon.png">
    <link href="/assets/admin/vendor/jquery-nice-select/css/nice-select.css" rel="stylesheet">
    <link href="/assets/admin/css/style.css" rel="stylesheet">
</head>
<body class="vh-100">
<div class="authincation h-100">
    <div class="container h-100">
        <div class="row justify-content-center h-100 align-items-center">
            <div class="col-md-6">
                <div class="authincation-content">
                    <div class="row no-gutters"><div class="col-xl-12"><div class="auth-form">
                        <div class="text-center mb-3"><a href="/"><img src="/assets/admin/images/logo-full.png" alt="Alam Segar"></a></div>
                        <h4 class="text-center mb-4">Welcome Back!</h4>
                        {{if .Error}}<div class="alert alert-danger" role="alert">{{.Error}}</div>{{end}}
                        <form action="/masuk" method="post" novalidate>
                            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                            <div class="mb-3">
                                <label class="mb-1" for="email"><strong>Email</strong></label>
                                <input id="email" name="email" type="email" class="form-control" autocomplete="email" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="mb-1" for="password"><strong>Kata Sandi</strong></label>
                                <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                            </div>
                            <div class="text-center mt-4">
                                <button type="submit" class="btn btn-primary btn-block">Masuk</button>
                            </div>
                        </form>
                        <div class="new-account mt-3 text-center"><p><a class="text-primary" href="/lupa-password">Lupa password?</a> · <a class="text-primary" href="/">Balik ke home</a></p></div>
                    </div></div></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/assets/admin/vendor/global/global.min.js"></script>
<script src="/assets/admin/js/custom.js"></script>
</body>
</html>
{{end}}
