{{define "tenant_profile"}}{{template "tenant_start" .}}{{$p:=.Payload}}{{if .Success}}<div class="alert alert-success">{{.Success}}</div>{{end}}<div class="row"><div class="col-xl-6"><div class="card"><div class="card-header"><h4>Profil</h4></div><div class="card-body"><p><strong>Nama:</strong> {{.User.Name}}<br><strong>Email:</strong> {{.User.Email}}</p><form method="post"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><div class="mb-3"><label>Telepon</label><input class="form-control" name="phone" value="{{$p.Phone}}" required></div><div class="mb-3"><label>Kontak darurat</label><input class="form-control" name="emergency_name" value="{{$p.EmergencyName}}"></div><div class="mb-3"><label>Telepon darurat</label><input class="form-control" name="emergency_phone" value="{{$p.EmergencyPhone}}"></div><button class="btn btn-primary">Simpan Profil</button></form></div></div></div><div class="col-xl-6"><div class="card"><div class="card-header"><h4>Ubah kata sandi</h4></div><div class="card-body"><form method="post" action="/penghuni/profil/password"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><div class="mb-3"><label>Kata sandi saat ini</label><input class="form-control" type="password" name="current_password" required></div><div class="mb-3"><label>Kata sandi baru</label><input class="form-control" type="password" name="new_password" required><small>Minimal 12 karakter, huruf besar/kecil, angka, simbol.</small></div><button class="btn btn-primary">Ubah Kata Sandi</button></form></div></div></div></div>{{template "tenant_end" .}}{{end}}
