{{define "tenant_notifications"}}{{template "tenant_start" .}}{{range .Payload}}<div class="card {{if not .Read}}border-primary{{end}}"><div class="card-body"><h5>{{.Title}}</h5><p>{{.Body}}</p><small>{{tanggal .CreatedAt}}</small>{{if not .Read}}<form class="mt-2" method="post" action="/penghuni/notifikasi/{{.ID}}/baca"><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}"><button class="btn btn-sm btn-outline-primary">Tandai Dibaca</button>{{if .URL}} <a class="btn btn-sm btn-primary" href="{{.URL}}">Buka</a>{{end}}</form>{{end}}</div></div>{{else}}<div class="card"><div class="card-body text-center py-5"><h5>Belum ada notifikasi</h5></div></div>{{end}}{{template "tenant_end" .}}{{end}}
