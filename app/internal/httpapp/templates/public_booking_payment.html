{{define "public_booking_payment"}}<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{{.Title}}</title><link rel="stylesheet" href="/assets/public/css/bootstrap.min.css"><link rel="stylesheet" href="/assets/public/css/style.css"></head><body><div class="subheader bg-cover bg-overlay-dark" style="background-image:url('/assets/public/images/subheader.jpg')"><div class="container"><h1 class="page-title">Upload Bukti</h1></div></div><section><div class="container"><div class="row justify-content-center"><div class="col-lg-7">{{if .Error}}<div class="alert alert-danger">{{.Error}}</div>{{end}}{{if .Success}}<div class="alert alert-success">{{.Success}}</div>{{end}}{{$p:=.Payload}}<div class="de-box"><div class="alert alert-warning">Upload bukan berarti auto-lunas. Owner tetap verifikasi.</div>{{if not $p.Banks}}<form method="get"><div class="mb-3"><label>Referensi booking approved</label><input class="form-control" name="referensi" value="{{$p.Reference}}" required></div><div class="mb-3"><label>Email</label><input class="form-control" type="email" name="email" value="{{$p.Email}}" required></div><button class="btn-main w-100">Cek Rekening</button></form>{{else}}<form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><input type="hidden" name="reference" value="{{$p.Reference}}"><input type="hidden" name="email" value="{{$p.Email}}"><p><strong>Referensi:</strong> {{$p.Reference}}</p><div class="mb-3"><label>Rekening tujuan</label><select class="form-control" name="bank_account_id" required><option value="">Pilih rekening</option>{{range $p.Banks}}<option value="{{.ID}}">{{.Bank}} — {{.Number}} a.n. {{.Name}}</option>{{end}}</select></div><div class="row"><div class="col-md-6 mb-3"><label>Nominal</label><input class="form-control" type="number" min="1" name="amount" required></div><div class="col-md-6 mb-3"><label>Tanggal transfer</label><input class="form-control" type="date" name="transfer_date" required></div></div><div class="mb-3"><label>Referensi bank (opsional)</label><input class="form-control" name="bank_reference"></div><div class="mb-3"><label>Bukti JPG/PNG/PDF</label><input class="form-control" type="file" name="proof" accept="image/jpeg,image/png,application/pdf" required></div><button class="btn-main w-100">Kirim Bukti</button></form>{{end}}</div></div></div></div></section></body></html>{{end}}
