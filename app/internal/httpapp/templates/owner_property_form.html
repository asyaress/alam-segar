{{define "owner_property_form"}}
{{template "owner_start" .}}
<div class="row justify-content-center"><div class="col-xl-9"><div class="card"><div class="card-header"><h4 class="card-title">{{if .PropertyForm.ID}}Ubah Properti{{else}}Tambah Properti{{end}}</h4></div><div class="card-body">
{{if .Error}}<div class="alert alert-danger" role="alert">{{.Error}}</div>{{end}}
<form method="post" action="{{if .PropertyForm.ID}}/pemilik/properti/{{.PropertyForm.ID}}/ubah{{else}}/pemilik/properti/baru{{end}}" novalidate>
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="row">
        <div class="col-md-4 mb-3"><label class="form-label" for="code">Kode</label><input id="code" name="code" class="form-control" value="{{.PropertyForm.Code}}" maxlength="40" placeholder="ALAM-SEGAR" required></div>
        <div class="col-md-8 mb-3"><label class="form-label" for="name">Nama Properti</label><input id="name" name="name" class="form-control" value="{{.PropertyForm.Name}}" maxlength="150" required></div>
        <div class="col-md-6 mb-3"><label class="form-label" for="slug">Slug URL</label><input id="slug" name="slug" class="form-control" value="{{.PropertyForm.Slug}}" maxlength="120" placeholder="alam-segar" required></div>
        <div class="col-md-6 mb-3"><label class="form-label" for="phone">Telepon Kontak</label><input id="phone" name="phone" class="form-control" value="{{.PropertyForm.Phone}}" maxlength="40"></div>
        <div class="col-12 mb-3"><label class="form-label" for="address">Alamat</label><textarea id="address" name="address" class="form-control" required>{{.PropertyForm.Address}}</textarea></div>
        <div class="col-12 mb-3"><label class="form-label" for="description">Deskripsi Publik</label><textarea id="description" name="description" class="form-control">{{.PropertyForm.Description}}</textarea></div>
        <div class="col-12 mb-3"><label class="form-label" for="rules_text">Peraturan Kos</label><textarea id="rules_text" name="rules_text" class="form-control">{{.PropertyForm.RulesText}}</textarea></div>
        <div class="col-md-6 mb-3"><label class="form-label" for="status">Status</label><select id="status" name="status" class="form-control" required><option value="active" {{if eq .PropertyForm.Status "active"}}selected{{end}}>Aktif</option><option value="inactive" {{if eq .PropertyForm.Status "inactive"}}selected{{end}}>Nonaktif</option></select></div>
        <div class="col-md-6 mb-3 d-flex align-items-end"><div class="form-check"><input id="published" name="published" value="1" type="checkbox" class="form-check-input" {{if .PropertyForm.Published}}checked{{end}}><label class="form-check-label" for="published">Tampilkan pada halaman publik</label></div></div>
    </div>
    <div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Simpan</button><a class="btn btn-light" href="/pemilik/properti">Batal</a></div>
</form>
</div></div></div></div>
{{template "owner_end" .}}
{{end}}
