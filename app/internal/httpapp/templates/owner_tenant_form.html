{{define "owner_tenant_form"}}{{template "owner_start" .}}{{$f := .Payload.Form}}
<div class="row justify-content-center"><div class="col-xl-8"><div class="card"><div class="card-header"><h4 class="card-title">Tambah penghuni aktif</h4></div><div class="card-body">
{{if .Error}}<div class="alert alert-danger">{{.Error}}</div>{{end}}<form method="post"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
<div class="row"><div class="col-md-6 mb-3"><label>Nama lengkap</label><input class="form-control" name="name" value="{{$f.name}}" required></div><div class="col-md-6 mb-3"><label>Email</label><input class="form-control" type="email" name="email" value="{{$f.email}}" required></div><div class="col-md-6 mb-3"><label>Telepon</label><input class="form-control" name="phone" value="{{$f.phone}}" required></div><div class="col-md-6 mb-3"><label>Kata sandi awal</label><input class="form-control" type="password" name="password" required></div><div class="col-md-6 mb-3"><label>Kontak darurat</label><input class="form-control" name="emergency_name" value="{{$f.emergency_name}}"></div><div class="col-md-6 mb-3"><label>Telepon darurat</label><input class="form-control" name="emergency_phone" value="{{$f.emergency_phone}}"></div></div>
<button class="btn btn-primary">Simpan Penghuni</button> <a class="btn btn-outline-secondary" href="/pemilik/penghuni">Batal</a></form></div></div></div></div>
{{template "owner_end" .}}{{end}}
